[package]
name = "briks-core"
version = "0.1.0"
edition = "2021"
description = "WebRTC nativo do app CUI: sinalização Supabase Realtime, malha P2P, DataChannel de chat assinado"
publish = false

[dependencies]
webrtc = "=0.12.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
futures-util = "0.3"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

bytes = "1"
opus = "0.3"
cpal = "0.15"
windows-capture = { version = "1", default-features = false }
openh264 = { version = "0.6", default-features = false, features = ["source"] }
memmap2 = { version = "0.9", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Variant", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Dwm", "Win32_System_Registry"] }

[workspace]
