[package]
name = "briks-core"
version = "0.1.0"
edition = "2021"
description = "WebRTC nativo do app CUI: sinalização Supabase Realtime, malha P2P, DataChannel de chat assinado"
publish = false

[dependencies]
webrtc = "=0.12.0"
log = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
futures-util = "0.3"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

bytes = "1"
opus = "0.3"
cpal = "0.15"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
bip39 = { version = "2", default-features = false, features = ["std", "portuguese"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
livekit-protocol = "=0.8.2"
prost = "0.14"
env-libvpx-sys = { version = "5", optional = true }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
lewton = "0.10.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
windows-capture = { version = "1", default-features = false }
openh264 = { version = "0.6", default-features = false, features = ["source"] }
memmap2 = { version = "0.9", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Security", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Variant", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Dwm", "Win32_System_Registry"] }
windows-core = "0.61"
[dev-dependencies]
socket2 = "0.5"
hmac = "0.12"

[features]
# VP8/VP9 por software (libvpx pré-compilada por scripts/build-vpx.ps1 em vendor/vpx/libvpx.lib). Desligada: o app só fala H264.
vpx = ["dep:env-libvpx-sys"]

[workspace]
